name: AI Worker

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max queue items to claim in one run
        required: false
        default: "3"
      translation_plugin_ids:
        description: Comma-separated plugin IDs to translate first
        required: false
        default: ""
      translation_override:
        description: Validated manual plugin translation JSON
        required: false
        default: ""

concurrency:
  group: ai-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-queue:
    name: Run pipeline AI checks
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Claim jobs, run checks and submit results
        env:
          WORKER_URL: https://exterastore.app/api/ai-worker
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CLAIM_LIMIT: ${{ inputs.limit }}
          TRANSLATION_PLUGIN_IDS: ${{ inputs.translation_plugin_ids }}
          TRANSLATION_OVERRIDE: ${{ inputs.translation_override }}
        run: node scripts/ai-worker.mjs
