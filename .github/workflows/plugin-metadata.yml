name: Plugin Metadata

on:
  workflow_dispatch:

concurrency:
  group: plugin-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify plugins
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Update categories and tags
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          SERVER_PORT="${SERVER_PORT:-22}"
          ssh -p "$SERVER_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ID=$(sudo docker ps -qf "name=app" | head -1)
          test -n "$APP_ID"
          sudo docker exec -i "$APP_ID" node --input-type=module <<'NODE'
          let offset = 0;
          const limit = 10;
          let total = Infinity;

          while (offset < total) {
            let completed = false;

            for (let attempt = 1; attempt <= 3 && !completed; attempt += 1) {
              const response = await fetch(
                `http://127.0.0.1:3000/api/cron/classify-plugins?offset=${offset}&limit=${limit}`,
                {
                  method: "POST",
                  headers: { authorization: `Bearer ${process.env.CRON_SECRET}` },
                  signal: AbortSignal.timeout(4 * 60 * 1000),
                },
              );
              const body = await response.text();
              console.log(`offset ${offset}, attempt ${attempt}, status ${response.status}`);
              console.log(body);

              if (!response.ok) {
                if (attempt === 3) process.exit(1);
                await new Promise((resolve) => setTimeout(resolve, attempt * 5_000));
                continue;
              }

              const result = JSON.parse(body);
              if (!result.success || result.failed > 0) process.exit(1);
              total = result.total;
              offset = result.nextOffset;
              completed = true;
            }
          }
          NODE
          REMOTE
