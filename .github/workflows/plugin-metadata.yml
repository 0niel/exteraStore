name: Plugin Metadata

on:
  workflow_dispatch:

concurrency:
  group: plugin-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify:
    name: Classify plugins
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Update categories and tags
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          let offset = 0;
          const limit = 10;
          let total = Infinity;

          while (offset < total) {
            let completed = false;

            for (let attempt = 1; attempt <= 3 && !completed; attempt += 1) {
              const response = await fetch(
                `https://exterastore.app/api/cron/classify-plugins?offset=${offset}&limit=${limit}`,
                {
                  method: "POST",
                  headers: { authorization: `Bearer ${process.env.CRON_SECRET}` },
                  signal: AbortSignal.timeout(4 * 60 * 1000),
                },
              );
              const body = await response.text();
              console.log(`offset ${offset}, attempt ${attempt}, status ${response.status}`);
              console.log(body);

              if (!response.ok) {
                if (attempt === 3) process.exit(1);
                await new Promise((resolve) => setTimeout(resolve, attempt * 5_000));
                continue;
              }

              const result = JSON.parse(body);
              if (!result.success || result.failed > 0) process.exit(1);
              total = result.total;
              offset = result.nextOffset;
              completed = true;
            }
          }
          NODE
